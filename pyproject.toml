# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacore"
version = "0.1.0"
description = "Lightweight Data Warehouse using DuckDB and Parquet"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Daniel Martínez", email = "carlos.daniel.m.z@hotmail.com"}
]
keywords = ["data warehouse", "duckdb", "parquet", "hr analytics", "business intelligence"]

dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
]

[project.urls]
Repository = "https://github.com/Daniel98M/Lightweight-Data-Warehouse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]